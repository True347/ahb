# Cargo.toml — Phase 0 + Phase 1
[package]
name = "ahb"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "AHB — AI HP Bar — multi-CLI subscription session usage at a glance"
repository = "https://github.com/True347/ahb"
readme = "README.md"
keywords = ["claude", "codex", "gemini", "cli", "tui"]
categories = ["command-line-utilities"]

[dependencies]
# Phase 0 — CLI parsing.
clap = { version = "4.6", features = ["derive"] }

# Phase 0 dep minimalism (rt+macros). Phase 1 upgrades to multi-thread runtime + fs/time/signal/sync
# because Engine fan-out uses JoinSet and TUI (Plan 03) needs `tokio::time::interval` + `signal::ctrl_c`.
# DO NOT use features = ["full"] (STACK.md "What NOT to use" — ~30% binary bloat).
tokio = { version = "1.52", default-features = false, features = ["rt-multi-thread", "macros", "fs", "time", "signal", "sync"] }

# Phase 0 — Provider trait async boxing (dyn-compat).
async-trait = "0.1"

# Phase 0 — universal (de)serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Phase 0 — date/time, also drives Phase 1 5h cluster anchor math.
jiff = { version = "0.2", features = ["serde"] }

# Phase 0 — error glue.
anyhow = "1"
thiserror = "2"

# Phase 0 — CLI color (used by Phase 1 compact-line bar coloring).
owo-colors = { version = "4", features = ["supports-colors"] }

# Phase 1 — JSONL file discovery for Claude adapter (REQ ADP-02).
glob = "0.3"

# Phase 2 — ADP-04 Codex state DB read-only (bundled SQLite = no system dep).
rusqlite = { version = "0.39", features = ["bundled"] }

# Phase 1 — cross-OS config path resolution (REQ CFG-02; D-39).
directories = "6"

# Phase 1 — TOML config parser (REQ CFG-01; D-36).
toml = "0.8"

# Phase 1 — structured logging (JSONL parse warns, unknown-key warns, drift warns).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Phase 1 Plan 03 — TUI surface (REQ TUI-01/02/04/05). 0.30 is the locked version (STACK.md);
# brings its own `crossterm` 0.29 via `ratatui::crossterm` re-export.
ratatui = "0.30"

# Phase 1 Plan 03 — TUI EventStream::next via StreamExt in tokio::select! (TUI-01).
# `ratatui::crossterm::event::EventStream` returns a `Stream`; consuming `.next().await`
# requires `futures_util::StreamExt` in scope (WARNING #4 — Context7-verified).
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Phase 1 Plan 03 — DEVIATION (Rule 3 blocking): we MUST list `crossterm` directly to
# enable the `event-stream` feature on the same crossterm 0.29 that `ratatui-crossterm`
# already pulls in. `ratatui-crossterm` does NOT propagate the `event-stream` feature on
# its inner crossterm dep, so `ratatui::crossterm::event::EventStream` is otherwise
# unreachable. Cargo's feature unification merges this into ratatui-crossterm's
# crossterm 0.29 — there is NO double-version hazard (the same Cargo.lock entry is
# shared), which is the actual Pitfall L2 concern. The `clippy.toml disallowed-types`
# rules still forbid USING `crossterm::*` paths directly in source — production code
# goes through `ratatui::crossterm::*` re-exports. Plan 03 SUMMARY.md documents this
# deviation; the original gate `grep -c 'crossterm' Cargo.toml = 0` was authored
# before the EventStream feature gating was observed at execution time.
crossterm = { version = "0.29", default-features = false, features = ["event-stream", "events"] }

# Phase 1 Plan 02 — OS keyring abstraction (REQ SEC-01; D-40, D-41, D-42).
# Provenance verified 2026-05-23: `repository` field on crates.io points to
# `github.com/open-source-cooperative/keyring-core.git` (same org as the cfg-gated
# `*-keyring-store` companion crates below). DO NOT swap for the `keyring` v4 crate —
# v4 is a demo/CLI shell, NOT a library (STACK.md "What NOT to use"). Phase 2 Codex +
# Phase 3 Gemini consume this through `Entry::new("ahb", "<provider-id>")` once the
# `*-keyring-store` companion (cfg-gated below) is registered via `set_default_store`.
keyring-core = "1"

# Phase 1 Plan 02 — Drop-time memory zero for `Secret<T>` (REQ SEC-02; D-42).
# Provenance verified 2026-05-23: `repository` = `github.com/RustCrypto/utils`
# (RustCrypto org, canonical pick per RESEARCH Pattern 6).
zeroize = "1.8"

# Phase 3 — moka stale-on-error cache (D-66, D-67). sync feature only; no TTL set
# (manual stale semantics per D-71 — moka auto-eviction disabled).
moka = { version = "0.12", default-features = false, features = ["sync"] }

# Phase 1 Plan 02 — cfg-gated `*-keyring-store` companions for `set_default_store`.
# Each crate's `repository` was verified on crates.io 2026-05-23 to point under
# `github.com/open-source-cooperative/*` (same org that publishes `keyring-core`).
# The `crypto-rust` feature on the Linux backend avoids OpenSSL (STACK.md rustls-only
# binding — keeps the binary musl-static-friendly + clean Windows build).
[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1", default-features = false, features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[dev-dependencies]
# Phase 0 — compile-time trait checks.
static_assertions = "1"

# Phase 1 — filesystem fixtures for Claude adapter + config + first-run tests.
tempfile = "3"

# Phase 1 — end-to-end CLI integration tests (assert exit codes, stdout shape, env injection).
assert_cmd = "2"
predicates = "3"

# Phase 1 — regex used by Plan 02's secret-leak test and Plan 01's integration test stdout matching.
regex = "1"

# Phase 1 Plan 03 — TUI-04 panic-safe restore integration test (tests/tui_panic_safe_restore.rs);
# runtime-free pty allocation so we can spawn `AHB tui` inside a real pty and observe the
# alt-screen enter/leave sequences on panic. WARNING #6 resolution — replaces prior
# manual-only deferral.
portable-pty = "0.9"

[profile.release]
# Phase 4 will tune more. Phase 0 default is fine.
