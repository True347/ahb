# AHB — AI HP Bar config. Enable the providers you have subscriptions for.
#
# Run `AHB` after editing — uncovered providers are silently skipped (not flagged as failures).

[providers.claude]
enabled = false  # Claude Code subscription — reads ~/.claude/projects/**/*.jsonl

[providers.codex]
enabled = false  # Codex CLI subscription — reads ~/.codex/sessions/**/rollout-*.jsonl + state_*.sqlite (read-only)

[providers.gemini]
enabled = false  # Gemini CLI subscription — deferred to v2 stub (see README §Gemini status)
